[package]
name = "pycl"
version = "0.1.0"
edition = "2024"

[features]
default = ["dev-jvm"]
dev-jvm = ["jni"]
release-native = []

[dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }
jni = { version = "0.21.1", features = ["invocation"], optional = true }
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
libc = "0.2.169"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 비동기 백그라운드 런타임 & 스토리지 드라이버
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time"] }
once_cell = "1.20"
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
surrealdb = { version = "3", features = ["protocol-ws"] }

[lib]
name = "pycl"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pycl"
path = "src/main.rs"