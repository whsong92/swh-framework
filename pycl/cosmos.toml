[runtime]
arena_capacity = 1024
log_level = "info"

# L1 Fast Working Memory (Redis)
[storage.redis]
url = "redis://redis:6379"
connection_timeout_ms = 2000

# L2 Cognitive Topology Graph (SurrealDB)
[storage.surrealdb]
endpoint = "surrealdb:8000"
user = "root"
pass = "root"
namespace = "cosmos"
database = "topology"
connection_timeout_ms = 3000

[storage.mongo]
uri = "mongodb://root:root@mongodb:27017"
db_name = "swhai_meta"
connection_timeout_ms = 2000